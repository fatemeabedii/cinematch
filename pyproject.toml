[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematch"
version = "0.1.0"
description = "MovieLens-1M recommender: anomaly filter, MF, two-tower, K-means taste profiles, contextual bandit."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
